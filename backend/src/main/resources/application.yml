spring:
  application:
    name: atelie-gg-backend
  data:
    web:
      pageable:
        default-page-size: 25
        max-page-size: 100
  datasource:
    # Supabase: use DB_SSL_MODE=require e o host do painel (Connection string).
    # Ex.: jdbc:postgresql://db.xxxx.supabase.co:5432/postgres?sslmode=require
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:atelie_gg}?sslmode=${DB_SSL_MODE:disable}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      # Plano gratuito do Supabase tem poucas conexões — não aumente sem necessidade.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Sao_Paulo
  jackson:
    time-zone: America/Sao_Paulo
    serialization:
      write-dates-as-timestamps: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  # Render injeta PORT; localmente usa SERVER_PORT ou 8080
  port: ${PORT:${SERVER_PORT:8080}}

atelie:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-very-long-secret-key-at-least-256-bits}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  upload:
    dir: ${UPLOAD_DIR:uploads}
  mercadopago:
    public-key: ${MERCADOPAGO_PUBLIC_KEY:}
    access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
    webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
    success-url: ${MERCADOPAGO_SUCCESS_URL:http://localhost:5173/checkout/sucesso}
    failure-url: ${MERCADOPAGO_FAILURE_URL:http://localhost:5173/checkout/falha}
    pending-url: ${MERCADOPAGO_PENDING_URL:http://localhost:5173/checkout/pendente}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:atelie.gig@gmail.com}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:GIG — Moda Feminina <atelie.gig@gmail.com>}
  orders:
    payment-expiration-hours: ${ORDER_PAYMENT_EXPIRATION_HOURS:24}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  shipping:
    origin-cep: ${SHIPPING_ORIGIN_CEP:01310100}
    weight-per-item-kg: ${SHIPPING_WEIGHT_PER_ITEM_KG:0.35}
    max-weight-kg: ${SHIPPING_MAX_WEIGHT_KG:10}
    package-length-cm: ${SHIPPING_PACKAGE_LENGTH_CM:30}
    package-height-cm: ${SHIPPING_PACKAGE_HEIGHT_CM:10}
    package-width-cm: ${SHIPPING_PACKAGE_WIDTH_CM:25}
    timeout-ms: ${SHIPPING_TIMEOUT_MS:2500}
    try-legacy-api: ${SHIPPING_TRY_LEGACY_API:false}
  admin:
    name: ${ADMIN_NAME:GIG — Moda Feminina}
    email: ${ADMIN_EMAIL:atelie.gig@gmail.com}
    password: ${ADMIN_PASSWORD:}
    reset-password: ${ADMIN_RESET_PASSWORD:false}

springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}

logging:
  level:
    com.ateliegg: INFO
