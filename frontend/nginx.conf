server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10M;
    server_tokens off;

    # --- Defesas HTTP (XSS / clickjacking / sniffing) ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "0" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self' 'unsafe-inline' https://sdk.mercadopago.com https://http2.mlstatic.com https://www.google.com https://accounts.google.com; frame-src 'self' https://www.mercadopago.com https://www.mercadopago.com.br https://www.google.com https://accounts.google.com; connect-src 'self' https://api.mercadopago.com https://api.mercadolibre.com https://viacep.com.br https://accounts.google.com; base-uri 'self'; form-action 'self';" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header x-signature $http_x_signature;
        proxy_set_header x-request-id $http_x_request_id;
        client_max_body_size 10M;
    }

    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_set_header Host $host;
        # nosniff + MIME correto: se o Content-Type vier vazio do Java,
        # o browser precisa de image/* (não octet-stream) para exibir no <img>.
        add_header X-Content-Type-Options "nosniff" always;
        types {
            image/jpeg jpg jpeg;
            image/png  png;
            image/webp webp;
        }
        default_type application/octet-stream;
    }

    # Camuflagem: documentação da API não fica pública pelo Nginx
    location /swagger-ui { return 404; }
    location /swagger-ui.html { return 404; }
    location /api-docs { return 404; }
    location /v3/api-docs { return 404; }
}
