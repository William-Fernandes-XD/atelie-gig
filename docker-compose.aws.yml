# Uso na EC2 (Amazon Linux):
#   docker compose -f docker-compose.yml -f docker-compose.aws.yml up -d --build
#
# Requer no .env:
#   PUBLIC_HOST=SEU_IP.sslip.io   (ex. 15.229.118.238.sslip.io)
#   CORS_ALLOWED_ORIGINS=https://SEU_IP.sslip.io
#   FRONTEND_PORT=127.0.0.1:5173
#   (Caddy publica 80/443; frontend fica so no localhost da maquina)

services:
  frontend:
    # Evita publicar a porta 80 no host (isso fica com o Caddy).
    # No .env da AWS use: FRONTEND_PORT=127.0.0.1:5173
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    container_name: atelie-gg-caddy
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
